
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Prizrak</title>
<style>
:root{
 --bg:#100d16;--panel:#1c1723;--text:#fff;
 --muted:#a99eae;--accent:#f04448;
 --field:#120f19;--line:#382b3b;
}
body.light{
 --bg:#fff8f5;--panel:#fff;--text:#281c25;
 --muted:#887780;--accent:#df2636;
 --field:#fff8f5;--line:#f0dadd;
}
*{box-sizing:border-box}
body{
 margin:0;padding:20px 16px 40px;
 min-height:100vh;color:var(--text);
 background:radial-gradient(ellipse at 50% 0%,#54202e 0%,transparent 55%),var(--bg);
 font-family:Arial,sans-serif;transition:.3s;
}
body.light{background:radial-gradient(ellipse at 50% 0%,#ffe0d9,transparent 55%),var(--bg)}
.container{max-width:440px;margin:auto;position:relative}
header{text-align:center;padding:25px 0}
.avatar{
 width:105px;height:105px;background:white;
 border:3px solid var(--accent);border-radius:30px;
 display:inline-flex;align-items:center;justify-content:center;
 cursor:pointer;box-shadow:0 0 28px #f0444840;
}
.avatar svg{width:70px;height:70px;fill:#df2636}
h1{font-size:26px;margin:14px 0 5px;letter-spacing:1px}
h1 span{color:var(--accent)}
.subtitle{color:var(--muted);font-size:13px}
.edition{color:var(--accent);font-size:11px;letter-spacing:3px;margin-top:12px}
.decoration{position:fixed;opacity:.13;pointer-events:none;font-size:30px}
.d1{top:25px;left:10px}.d2{top:170px;right:10px}
.d3{bottom:30px;left:15px}.d4{bottom:130px;right:15px}
.card{
 background:var(--panel);border:1px solid var(--line);
 border-radius:22px;padding:19px;margin-bottom:15px;
 box-shadow:0 8px 25px #00000018;
}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:10px}
input,textarea{
 width:100%;padding:15px;border:1px solid var(--line);
 border-radius:13px;background:var(--field);
 color:var(--text);font-size:16px;outline:none;
}
textarea{height:140px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
button{
 border:0;border-radius:14px;padding:16px;
 font-size:15px;font-weight:bold;cursor:pointer;
 transition:.2s;
}
button:active{transform:scale(.97)}
.primary{width:100%;background:var(--accent);color:white;margin-top:14px}
.secondary{
 width:100%;background:transparent;color:var(--text);
 border:1px solid var(--accent);margin-top:12px;
}
.status{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;min-height:18px}
.page{display:none}
.page.active{display:block}
.back{background:transparent;color:var(--accent);padding:5px 0 16px}
.amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.amount{
 background:var(--field);color:var(--text);
 border:1px solid var(--line);font-size:21px;
}
.amount.selected{background:var(--accent);color:white;border-color:var(--accent)}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.custom{margin-top:10px}
.pay-title{text-align:center;margin:5px 0 15px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="decoration d1">🦇</div>
<div class="decoration d2">🕸️</div>
<div class="decoration d3">🎃</div>
<div class="decoration d4">👻</div>

<div class="container">
<header>
 <div class="avatar" onclick="toggleTheme()">
  <svg viewBox="0 0 100 100">
   <path d="M50 7C25 7 12 25 12 48V80C12 89 20 94 28 87L38 79C45 85 55 85 62 79L72 87C80 94 88 89 88 80V48C88 25 75 7 50 7Z"/>
   <rect x="32" y="38" width="9" height="19" rx="4" fill="white"/>
   <rect x="59" y="38" width="9" height="19" rx="4" fill="white"/>
  </svg>
 </div>
 <h1>RED <span>PRIZRAK</span></h1>
 <div class="subtitle">Anonymous SMS</div>
 <div class="edition">☠ HALLOWEEN EDITION ☠</div>
</header>

<!-- ГЛАВНАЯ -->
<section id="home" class="page active">
 <div class="card">
  <label>📱 Номер получателя</label>
  <input id="phone" type="tel" placeholder="+7 999 123-45-67">
 </div>
 <div class="card">
  <label>👻 Сообщение</label>
  <textarea id="message" maxlength="1000" placeholder="Напиши сообщение..."></textarea>
  <button class="primary" onclick="sendSMS()">🎃 ОТПРАВИТЬ SMS</button>
  <div class="status" id="smsStatus"></div>
 </div>
 <button class="secondary" onclick="openPage('support')">🕯️ Поддержать автора</button>
</section>

<!-- ПОДДЕРЖКА -->
<section id="support" class="page">
 <button class="back" onclick="openPage('home')">← Назад</button>
 <div class="card">
  <div class="pay-title">
   <div style="font-size:35px">🎃</div>
   <h2>Поддержать автора</h2>
   <div class="small">Выбери сумму поддержки</div>
  </div>
  <div class="amounts">
   <button class="amount" onclick="chooseAmount(50,this)">50 ₽</button>
   <button class="amount" onclick="chooseAmount(100,this)">100 ₽</button>
   <button class="amount" onclick="chooseAmount(150,this)">150 ₽</button>
   <button class="amount" onclick="chooseAmount(200,this)">200 ₽</button>
  </div>
  <label>Или выбери свою сумму</label>
  <input class="custom" id="customAmount" type="number" min="1" max="100000" placeholder="Сумма в рублях" oninput="customChanged()">
  <button class="primary" onclick="pay()">❤️ Поддержать</button>
  <div class="status" id="payStatus"></div>
  <p class="small">Платёжный сервис пока не подключён. Кнопка демонстрирует выбор суммы, но деньги не списываются.</p>
 </div>
</section>

<footer>
 🎃 🦇 🎃<br><br>
 RED PRIZRAK © 2026
</footer>
</div>

<script>
let selectedAmount=0;

function toggleTheme(){
 document.body.classList.toggle('light');
}

function openPage(name){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(name).classList.add('active');
 window.scrollTo({top:0,behavior:'smooth'});
}

function sendSMS(){
 const phone=document.getElementById('phone').value.trim();
 const message=document.getElementById('message').value.trim();
 const status=document.getElementById('smsStatus');

 if(!phone||!message){
  status.textContent='👻 Заполни номер и сообщение!';
  return;
 }
 if(!/^\+[0-9\s()-]{7,20}$/.test(phone)){
  status.textContent='⚠️ Проверь номер телефона.';
  return;
 }
 status.textContent='🎃 Демо-режим: SMS-сервер ещё не подключён.';
}

function chooseAmount(amount,button){
 selectedAmount=amount;
 document.getElementById('customAmount').value='';
 document.querySelectorAll('.amount').forEach(b=>b.classList.remove('selected'));
 button.classList.add('selected');
 document.getElementById('payStatus').textContent='Выбрано: '+amount+' ₽';
}

function customChanged(){
 const value=Number(document.getElementById('customAmount').value);
 selectedAmount=value>0?value:0;
 document.querySelectorAll('.amount').forEach(b=>b.classList.remove('selected'));
 document.getElementById('payStatus').textContent=
 value>0?'Выбрано: '+value+' ₽':'';
}

function pay(){
 const status=document.getElementById('payStatus');
 if(!selectedAmount||selectedAmount<1||selectedAmount>100000){
  status.textContent='Выбери сумму от 1 до 100 000 ₽.';
  return;
 }
 status.textContent='Выбрано '+selectedAmount+' ₽. Платёжный сервис пока не подключён.';
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Prizrak — Anonymous SMS</title>
<style>
:root {
  --bg:#100d16;
  --panel:#1c1723;
  --text:#fff;
  --muted:#a99eae;
  --accent:#f04448;
  --field:#120f19;
  --line:#382b3b;
  --button-text:#fff;
}
body.light {
  --bg:#fff8f5;
  --panel:#fff;
  --text:#281c25;
  --muted:#887780;
  --accent:#df2636;
  --field:#fff8f5;
  --line:#f0dadd;
  --button-text:#fff;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  padding:24px 17px 35px;
  background:
    radial-gradient(ellipse at 50% 0%,#54202e 0%,transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  transition:.3s;
}
body.light {
  background:
    radial-gradient(ellipse at 50% 0%,#ffe0d9 0%,transparent 55%),
    var(--bg);
}
.container {max-width:440px;margin:auto;position:relative}
.decoration {
  position:fixed;
  pointer-events:none;
  opacity:.15;
  font-size:30px;
  z-index:0;
}
.d1 {top:35px;left:12px}
.d2 {top:150px;right:12px}
.d3 {bottom:45px;left:20px}
.d4 {bottom:120px;right:18px}
.moon {
  position:absolute;
  top:4px;
  right:18px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffdf9a;
  box-shadow:0 0 30px #ffdf9a66;
}
.moon:after {
  content:"";
  position:absolute;
  left:-9px;
  top:-5px;
  width:45px;
  height:45px;
  background:var(--bg);
  border-radius:50%;
}
body.light .moon {opacity:.5}
header {
  position:relative;
  z-index:1;
  text-align:center;
  padding-top:25px;
  margin-bottom:28px;
}
.avatar {
  width:112px;
  height:112px;
  border-radius:32px;
  background:white;
  border:3px solid var(--accent);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 28px #f0444840;
  cursor:pointer;
  transition:.25s;
}
.avatar:active {transform:scale(.94)}
.avatar svg {width:72px;height:72px;fill:#df2636}
h1 {
  margin:17px 0 5px;
  font-size:26px;
  letter-spacing:1px;
}
h1 span {color:var(--accent)}
.subtitle {color:var(--muted);font-size:13px}
.halloween-title {
  color:var(--accent);
  font-size:12px;
  letter-spacing:3px;
  margin-top:13px;
}
.card {
  position:relative;
  z-index:1;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:19px;
  margin-bottom:16px;
  box-shadow:0 9px 28px #00000018;
}
label {
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}
input,textarea {
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--field);
  color:var(--text);
  font-size:16px;
  outline:none;
  font-family:Arial,sans-serif;
}
input:focus,textarea:focus {border-color:var(--accent)}
textarea {height:145px;resize:vertical}
button {
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
button:active {transform:scale(.97)}
.send {
  background:var(--accent);
  color:var(--button-text);
  box-shadow:0 5px 18px #f0444840;
  margin-top:15px;
}
.support {
  background:transparent;
  border:1px solid var(--accent);
  color:var(--text);
  margin-top:12px;
}
.status {
  text-align:center;
  min-height:20px;
  margin-top:12px;
  font-size:13px;
  color:var(--muted);
}
footer {
  text-align:center;
  margin-top:30px;
  font-size:12px;
  color:var(--muted);
}
footer .pumpkin {font-size:24px;margin-bottom:8px}
</style>
</head>

<body>
<div class="decoration d1">🦇</div>
<div class="decoration d2">🕸️</div>
<div class="decoration d3">🎃</div>
<div class="decoration d4">👻</div>

<div class="container">
  <div class="moon"></div>

  <header>
    <div class="avatar" onclick="toggleTheme()" title="Сменить тему">
      <svg viewBox="0 0 100 100">
        <path d="M50 7 C25 7 12 25 12 48 V80
        C12 89 20 94 28 87 L38 79
        C45 85 55 85 62 79 L72 87
        C80 94 88 89 88 80 V48
        C88 25 75 7 50 7Z"/>
        <rect x="32" y="38" width="9" height="19" rx="4" fill="white"/>
        <rect x="59" y="38" width="9" height="19" rx="4" fill="white"/>
      </svg>
    </div>

    <h1>RED <span>PRIZRAK</span></h1>
    <div class="subtitle">Anonymous SMS</div>
    <div class="halloween-title">☠ HALLOWEEN EDITION ☠</div>
  </header>

  <main>
    <section class="card">
      <label>📱 Номер получателя</label>
      <input id="phone" type="tel" placeholder="+49 123 456789">
    </section>

    <section class="card">
      <label>👻 Сообщение</label>
      <textarea id="message" maxlength="1000"
        placeholder="Напиши своё сообщение..."></textarea>

      <button class="send" onclick="sendMessage()">
        🎃 ОТПРАВИТЬ
      </button>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <button class="support" onclick="support()">
        🕯️ Поддержать автора
      </button>
    </section>
  </main>

  <footer>
    <div class="pumpkin">🎃 🦇 🎃</div>
    RED PRIZRAK © 2026
    <br>Enter the Halloween world...
  </footer>
</div>

<script>
function toggleTheme() {
  document.body.classList.toggle("light");
}

function sendMessage() {
  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message").value.trim();
  const status = document.getElementById("status");

  if (!phone || !message) {
    status.textContent = "👻 Заполни номер и сообщение!";
    return;
  }

  if (!/^\+[0-9\s()-]{7,20}$/.test(phone)) {
    status.textContent = "⚠️ Проверь номер телефона.";
    return;
  }

  status.textContent =
    "🎃 Интерфейс готов! Для настоящей отправки подключи SMS-сервер.";

  // Здесь пока нет реальной отправки SMS.
}

function support() {
  window.open("https://t.me/k0tikcom", "_blank");
}
</script>
</body>
</html>

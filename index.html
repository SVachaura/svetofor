
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LEGO WORLD CLASSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a2c;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100dvh;position:relative}
canvas{display:block}
.top{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;align-items:center;
 pointer-events:none
}
.logo{font-size:18px;font-weight:900;color:#ffcf35}
.pill{background:#101a2ddd;padding:10px 14px;border-radius:12px}
button{border:0;color:white;background:#203957;border-radius:12px;padding:12px;font-weight:bold}
#controls{
 position:absolute;bottom:22px;left:15px;right:15px;
 display:flex;justify-content:space-between;align-items:end;
 pointer-events:none
}
.pad,.actions{display:grid;gap:6px;pointer-events:auto}
.pad{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px}
.pad button{padding:0;font-size:20px;background:#172b48dd}
.pad .up{grid-column:2}
.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}
.pad .right{grid-column:3;grid-row:2}
.actions button{width:70px;height:55px;background:#ffcf35;color:#182033}
#hint{position:absolute;bottom:145px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 5px black;font-size:12px;pointer-events:none}
#info{position:absolute;top:65px;left:12px;background:#101a2dcc;padding:9px 12px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="game">
 <div class="top">
  <div class="logo">🧱 LEGO WORLD</div>
  <button id="time">☀️ День</button>
 </div>
 <div id="info">CLASSIC WORLD • 0.1</div>
 <div id="hint">Управление кнопками или WASD • Вращай камеру пальцем</div>
 <div id="controls">
  <div class="pad">
   <button class="up" data-move="forward">▲</button>
   <button class="left" data-move="left">◀</button>
   <button class="down" data-move="back">▼</button>
   <button class="right" data-move="right">▶</button>
  </div>
  <div class="actions">
   <button id="jump">ПРЫЖОК</button>
  </div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ac9fa);
scene.fog=new THREE.Fog(0x8ac9fa,35,100);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
camera.position.set(0,6,11);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x657b54,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.8});

const grass=mat(0x62b64b);
const green=mat(0x31933e);
const brown=mat(0x85502b);
const roadmat=mat(0x444c57);
const yellow=mat(0xffd629);
const blue=mat(0x1463cf);
const red=mat(0xe73535);
const white=mat(0xffffff);

function cube(x,y,z,sx,sy,sz,material,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(x,y,z,r1,r2,h,material,parent=scene){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,24),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);return m;
}

// Земля
cube(0,-.3,0,100,.5,100,grass);

// Дорога
cube(0,-.025,0,9,.12,75,roadmat);
for(let z=-35;z<36;z+=5)
 cube(0,.05,z, .18,.04,2.4,yellow);

// Тротуары
cube(-5,.03,0,1,.2,75,mat(0xbababa));
cube(5,.03,0,1,.2,75,mat(0xbababa));

// Кирпичный дом
function house(x,z,color){
 const g=new THREE.Group();scene.add(g);
 cube(x,1.5,z,6,3.1,5,mat(color),g);
 cube(x,3.45,z,6.3,.35,5.3,mat(0x8b3535),g);
 cube(x,1,z+2.56,1.3,2, .15,mat(0x784525),g);
 cube(x-1.8,2,z+2.58,1.1,.9,.15,mat(0x75d8ff),g);
 cube(x+1.8,2,z+2.58,1.1,.9,.15,mat(0x75d8ff),g);
 for(let i=-2;i<=2;i++)
  for(let j=-1;j<=1;j++)
   cylinder(x+i*1.1,3.68,z+j*1.1,.18,.18,.12,mat(0xffd14c),g);
}
house(-10,-8,0xf2c34b);
house(10,-15,0x79a9ed);
house(-11,12,0xe28b55);
house(11,13,0xd7d7e8);

// Деревья
function tree(x,z){
 cylinder(x,.9,z,.35,.45,1.8,brown);
 const crown=mat(0x269c47);
 cube(x,2.4,z,2,2,2,crown);
 cylinder(x,3.5,z,.18,.18,.12,yellow);
}
for(let x of [-18,-14,14,18])
 for(let z of [-23,-10,5,22])
  tree(x,z);

// Фонари
function lamp(x,z){
 cylinder(x,1.6,z,.09,.09,3,mat(0x333b48));
 cube(x,3.2,z,.8,.18,.8,yellow);
}
lamp(-6,-5);lamp(6,-5);lamp(-6,15);lamp(6,15);

// Персонажи
function character(x,z,shirt,isPlayer=false){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 const skin=mat(0xffd52c);
 const shirtmat=mat(shirt);
 const pants=mat(0x164dba);
 const black=mat(0x252525);

 // Туловище
 cube(0,1.55,0,.85,1,.45,shirtmat,g);

 // Шея и голова
 cylinder(0,2.12,0,.18,.18,.2,skin,g);
 cylinder(0,2.65,0,.48,.48,.85,skin,g);

 // Волосы
 if(!isPlayer)
  cube(0,3.13,0,.9,.18,.9,black,g);

 // Лицо
 cube(0,2.62,.425,.5,.045,.02,black,g);
 cube(-.13,2.77,.45,.065,.08,.035,black,g);
 cube(.13,2.77,.45,.065,.08,.035,black,g);
 cube(0,2.46,.46,.2,.035,.025,red,g);

 // Руки
 const arms=[];
 for(let side of [-1,1]){
  const arm=cube(side*.58,1.65,0,.28,.8,.32,shirtmat,g);
  arm.userData.side=side;arms.push(arm);
  cylinder(side*.58,1.15,0,.17,.17,.3,skin,g);
 }
 // Ноги
 const legs=[];
 for(let side of [-1,1]){
  const leg=cube(side*.23,.55,0,.36,.85,.42,pants,g);
  legs.push(leg);
 }
 g.userData.legs=legs;
 g.userData.arms=arms;
 g.userData.baseY=0;
 return g;
}

const player=character(0,8,0x1264d9,true);
const people=[
 {g:character(-7,-8,0xe53935),name:"Макс",job:"Житель"},
 {g:character(7,-13,0x28a65b),name:"Алекс",job:"Продавец"},
 {g:character(-9,10,0x8c50c8),name:"Дима",job:"Строитель"}
];

// NPC-имена
people.forEach((p,i)=>{
 p.g.position.x+=i*.5;
});

// Камера и управление
const keys={};
let angle=0;
let jumpV=0;
let jumping=false;
let clock=0;
let day=true;
let activeDialog=null;

function movePlayer(dt){
 let dx=0,dz=0;
 if(keys.forward||keys.w)dz-=1;
 if(keys.back||keys.s)dz+=1;
 if(keys.left||keys.a)dx-=1;
 if(keys.right||keys.d)dx+=1;

 const moving=dx!==0||dz!==0;
 if(moving){
  const len=Math.hypot(dx,dz);
  dx/=len;dz/=len;
  const a=angle;
  const mx=dx*Math.cos(a)+dz*Math.sin(a);
  const mz=-dx*Math.sin(a)+dz*Math.cos(a);
  player.position.x+=mx*dt*5;
  player.position.z+=mz*dt*5;
  player.rotation.y=Math.atan2(mx,mz);
 }
 clock+=dt*(moving?10:2);
 player.userData.legs.forEach((leg,i)=>{
  leg.rotation.x=moving?Math.sin(clock+i*Math.PI)*.45:0;
 });
 player.userData.arms.forEach((arm,i)=>{
  arm.rotation.x=moving?-Math.sin(clock+i*Math.PI)*.4:0;
 });
 if(jumping){
  player.position.y+=jumpV*dt;
  jumpV-=12*dt;
  if(player.position.y<=0){
   player.position.y=0;jumping=false;
  }
 }
}

function cameraUpdate(){
 const target=new THREE.Vector3(
 player.position.x,2,player.position.z
 );
 const distance=10;
 camera.position.set(
 target.x+Math.sin(angle)*distance,
 target.y+5,
 target.z+Math.cos(angle)*distance
 );
 camera.lookAt(target);
}

document.querySelectorAll("[data-move]").forEach(btn=>{
 const k=btn.dataset.move;
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  btn.addEventListener(ev,()=>keys[k]=false));
});

document.getElementById("jump").onclick=()=>{
 if(!jumping){jumping=true;jumpV=6;}
};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space"&&!jumping){jumping=true;jumpV=6;}
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Вращение камеры пальцем
let lastX=null;
renderer.domElement.addEventListener("pointerdown",e=>{
 lastX=e.clientX;
});
window.addEventListener("pointermove",e=>{
 if(lastX!==null){
  angle+=(lastX-e.clientX)*.008;
  lastX=e.clientX;
 }
});
window.addEventListener("pointerup",()=>lastX=null);

// День / ночь
document.getElementById("time").onclick=()=>{
 day=!day;
 scene.background=new THREE.Color(day?0x8ac9fa:0x09132e);
 scene.fog.color.set(day?0x8ac9fa:0x09132e);
 sun.intensity=day?2.2:.2;
 scene.traverse(o=>{
  if(o.isMesh&&o.material===grass){}
 });
 document.getElementById("time").textContent=day?"☀️ День":"🌙 Ночь";
};

const clock3=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock3.getDelta(),.04);
 movePlayer(dt);
 cameraUpdate();
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneChat — Регистрация</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f2f6ff;
      font-family: Arial, sans-serif;
      color: #17233b;
    }

    .app {
      width: 100%;
      max-width: 380px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      background: #1769ff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 35px #1769ff12;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .description {
      color: #71809a;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 15px;
      border: 1px solid #dce5f5;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      background: white;
      color: #17233b;
    }

    input:focus {
      border-color: #1769ff;
      box-shadow: 0 0 0 3px #1769ff18;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #16803d;
    }

    .hidden {
      display: none;
    }

    .privacy {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #71809a;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">●</div>
    <div class="brand">OneChat</div>

    <section class="card">
      <h2 id="title">Вход по номеру</h2>

      <p class="description" id="description">
        Введи номер телефона, чтобы получить код.
      </p>

      <div id="phone-screen">
        <input
          id="phone"
          type="tel"
          autocomplete="tel"
          placeholder="+7 999 123-45-67"
        >

        <button id="send-code">
          Получить SMS-код
        </button>
      </div>

      <div id="code-screen" class="hidden">
        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="Код из SMS"
          aria-label="Код из SMS"
        >
      </div>

      <div id="message" class="message" role="status"></div>
    </section>

    <div class="privacy">
      🔒 Твой номер нужен для входа в OneChat.
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ВСТАВЬ СЮДА НАСТРОЙКИ СВОЕГО FIREBASE-ПРОЕКТА
    const firebaseConfig = {
      apiKey: "ВСТАВЬ_API_KEY",
      authDomain: "ВСТАВЬ_PROJECT_ID.firebaseapp.com",
      projectId: "ВСТАВЬ_PROJECT_ID",
      appId: "ВСТАВЬ_APP_ID"
    };

    const phoneScreen = document.getElementById("phone-screen");
    const codeScreen = document.getElementById("code-screen");
    const phoneInput = document.getElementById("phone");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("send-code");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const message = document.getElementById("message");

    let confirmation = null;
    let verifier = null;
    let checkingCode = false;

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function firebaseConfigured() {
      return firebaseConfig.apiKey !== "ВСТАВЬ_API_KEY"
        && firebaseConfig.projectId !== "ВСТАВЬ_PROJECT_ID"
        && firebaseConfig.appId !== "ВСТАВЬ_APP_ID";
    }

    if (firebaseConfigured()) {
      firebase.initializeApp(firebaseConfig);

      const auth = firebase.auth();
      auth.useDeviceLanguage();

      // Невидимая проверка, защищающая от автоматических запросов.
      verifier = new firebase.auth.RecaptchaVerifier(
        "send-code",
        {
          size: "invisible",
          callback: () => {}
        }
      );

      sendButton.addEventListener("click", async () => {
        const phone = phoneInput.value.trim();

        if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
          showMessage(
            "Введи номер в международном формате, например +79991234567."
          );
          return;
        }

        sendButton.disabled = true;
        showMessage("Отправляем SMS...", "success");

        try {
          confirmation = await auth.signInWithPhoneNumber(
            phone,
            verifier
          );

          // Кнопка исчезает. На её месте появляется поле кода.
          phoneScreen.classList.add("hidden");
          codeScreen.classList.remove("hidden");

          title.textContent = "Введи SMS-код";
          description.textContent =
            "Код отправлен на " + phone +
            ". Введи 6 цифр — проверка начнётся автоматически.";

          showMessage("");
          codeInput.focus();
        } catch (error) {
          console.error(error);

          let text = "Не удалось отправить SMS. Попробуй позже.";

          if (error.code === "auth/invalid-phone-number") {
            text = "Номер телефона указан неверно.";
          } else if (error.code === "auth/too-many-requests") {
            text = "Слишком много попыток. Попробуй позже.";
          } else if (error.code === "auth/quota-exceeded") {
            text = "Лимит SMS исчерпан.";
          } else if (
            error.code === "auth/operation-not-allowed"
          ) {
            text = "В Firebase не включён вход по номеру телефона.";
          }

          showMessage(text);
          verifier.clear();

          verifier = new firebase.auth.RecaptchaVerifier(
            "send-code",
            { size: "invisible" }
          );
        } finally {
          sendButton.disabled = false;
        }
      });

      // Автоматически проверяем код, когда введены все 6 цифр.
      codeInput.addEventListener("input", async () => {
        codeInput.value = codeInput.value
          .replace(/\D/g, "")
          .slice(0, 6);

        if (
          codeInput.value.length !== 6 ||
          checkingCode ||
          !confirmation
        ) {
          return;
        }

        checkingCode = true;
        codeInput.disabled = true;
        showMessage("Проверяем код...", "success");

        try {
          const result = await confirmation.confirm(
            codeInput.value
          );

          // Firebase подтвердил номер.
          title.textContent = "Добро пожаловать!";
          description.textContent =
            "Номер телефона успешно подтверждён.";

          codeScreen.classList.add("hidden");

          showMessage(
            "Регистрация прошла успешно!",
            "success"
          );

          // Пользователь авторизован в Firebase.
          // Здесь можно открыть основной экран OneChat.
          document.dispatchEvent(
            new CustomEvent("onechat-login", {
              detail: { user: result.user }
            })
          );
        } catch (error) {
          console.error(error);

          if (
            error.code === "auth/invalid-verification-code"
          ) {
            showMessage("Неверный код. Попробуй ещё раз.");
          } else if (
            error.code === "auth/code-expired"
          ) {
            showMessage("Срок действия кода истёк.");
          } else {
            showMessage("Не удалось проверить код. Попробуй ещё раз.");
          }

          codeInput.value = "";
          codeInput.disabled = false;
          codeInput.focus();
        } finally {
          checkingCode = false;
        }
      });

    } else {
      sendButton.addEventListener("click", () => {
        showMessage(
          "Сначала подключи Firebase: вставь настройки проекта в код."
        );
      });
    }
  </script>
</body>
</html>
